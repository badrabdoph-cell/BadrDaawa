name: PostgreSQL backups

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hourly backup
        if: github.event.schedule != '15 0 * * *'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/backup.mjs --type=hourly
      - name: Daily full backup
        if: github.event.schedule == '15 0 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/backup.mjs --type=daily
      - name: Commit backup
        run: |
          git config user.name "badrdaawa-backup-bot"
          git config user.email "backup@badrdaawa.com"
          git add backups
          git commit -m "chore: add automated database backup" || echo "No backup changes to commit"
          git push
