<svg width="900" height="1200" viewBox="0 0 900 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="104" y1="76" x2="792" y2="1110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#E3D0A9"/>
    </linearGradient>
    <linearGradient id="card" x1="260" y1="178" x2="640" y2="1018" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF8E9"/>
