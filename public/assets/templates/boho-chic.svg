    <rect x="240" y="790" width="420" height="110" rx="28" fill="#FAFAF8" stroke="#E2D8C8" stroke-width="3"/>
    <text x="450" y="858" text-anchor="middle" fill="#5C6659" font-family="Arial, sans-serif" font-size="30" font-weight="800">Countdown</text>

    <rect x="220" y="940" width="148" height="132" rx="28" fill="#9CAFA4"/>
