    <text x="450" y="494" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="78">Badr</text>
    <text x="450" y="558" text-anchor="middle" fill="#9CAFA4" font-family="Georgia, serif" font-size="52" font-style="italic">&amp;</text>
    <text x="450" y="640" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="78">Sarah</text>

    <rect x="220" y="568" width="460" height="190" rx="44" fill="#FFFFFF"/>
    <circle cx="450" cy="622" r="18" fill="#9CAFA4"/>
