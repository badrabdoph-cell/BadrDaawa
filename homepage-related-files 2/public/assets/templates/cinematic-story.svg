      <stop offset="0" stop-color="#273f38"/>
      <stop offset=".5" stop-color="#0a1110"/>
      <stop offset="1" stop-color="#0a1110"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" x2="1" y1="0" y2="1">
